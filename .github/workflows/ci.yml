name: CI Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration test suite
        run: pytest -v

      - name: Validate benchmark manifest, prompt registry, and red-team categories
        run: |
          python -c "
          import json, yaml
          from collections import Counter
          from pathlib import Path

          manifest = json.loads(Path('data/benchmark/split_manifest.json').read_text(encoding='utf-8'))
          assert manifest['counts_by_split']['test'] >= 100
          assert manifest['leakage_and_dedup_check']['leakage_free'] is True

          rt = [json.loads(l) for l in Path('red_team/red_team_suite.jsonl').read_text(encoding='utf-8').splitlines() if l.strip()]
          assert len(rt) >= 20
          cats = Counter(r['category'] for r in rt)
          assert len(cats) == 4 and all(v >= 5 for v in cats.values()), cats

          reg = yaml.safe_load(Path('prompts/registry.yaml').read_text(encoding='utf-8'))
          assert len(reg.get('prompts', {})) >= 7
          print('CI validation passed:', manifest['counts_by_split'], dict(cats))
          "
