<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGM Academic Policy Intelligence</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(160deg, #001021 0%, #001933 28%, #00264F 56%, #002C5C 80%, #00346B 100%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: #1b1f23;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.25rem 3rem;
    }

    /* Centered Hero Container (Bing / Gemini style) */
    .hero-wrapper {
      width: 100%;
      max-width: 820px;
      margin-top: 13vh;
      transition: margin-top 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-wrapper.has-results {
      margin-top: 3.2rem;
    }

    h1.hero-title {
      font-size: clamp(1.85rem, 3.6vw, 2.65rem);
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      margin: 0 0 1.75rem 0;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 14px rgba(0, 10, 22, 0.55);
    }

    /* Unified Search Box (No outline, no inner divider line) */
    .search-shell {
      width: 100%;
      background: rgba(255, 255, 255, 0.98);
      border: none;
      outline: none;
      border-radius: 26px;
      box-shadow: 0 14px 38px rgba(0, 10, 22, 0.42);
      padding: 1rem 1.25rem 0.85rem;
      transition: box-shadow 0.2s ease;
    }

    .search-shell:focus-within {
      outline: none;
      box-shadow: 0 18px 46px rgba(0, 10, 22, 0.55);
    }

    .search-input-row {
      display: flex;
      align-items: flex-start;
      gap: 0.65rem;
    }

    /* Search Icon Button on the Left */
    .search-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      outline: none;
      color: #6e7781;
      padding: 0.3rem;
      margin-top: 0.1rem;
      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .search-icon-btn:hover {
      background: rgba(0, 25, 51, 0.06);
      color: #1b1f23;
    }

    .search-icon-btn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    textarea#query {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-family: inherit;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #1b1f23;
      min-height: 54px;
      max-height: 180px;
      padding: 0.15rem 0;
    }

    textarea#query::placeholder {
      color: #6e7781;
    }

    /* Bottom Toolbar Inside Search Box (Right-aligned, no top border) */
    .search-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 0.45rem;
      margin-top: 0.45rem;
      padding-top: 0.15rem;
    }

    /* Custom "Konfigurasi v" Dropdown (Medium weight 500, pill hover) */
    .config-dropdown {
      position: relative;
    }

    .config-trigger {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      color: #2c333a;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .config-trigger:hover {
      background: rgba(0, 25, 51, 0.06);
    }

    .config-trigger svg {
      transition: transform 0.2s ease;
      color: #6e7781;
    }

    .config-dropdown.open .config-trigger svg {
      transform: rotate(180deg);
    }

    .config-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 310px;
      background: #ffffff;
      border: none;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 10, 22, 0.28);
      padding: 0.4rem;
      z-index: 50;
      display: none;
    }

    .config-dropdown.open .config-menu {
      display: block;
    }

    .config-option {
      display: flex;
      flex-direction: column;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      color: #1b1f23;
      transition: background 0.12s ease;
    }

    .config-option:hover {
      background: #f0f6fc;
    }

    .config-option.active {
      background: #e6f0fa;
      color: #00264F;
    }

    .config-option-title {
      font-size: 0.86rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .config-option-desc {
      font-size: 0.75rem;
      font-weight: 400;
      color: #57606a;
      margin-top: 0.12rem;
    }

    /* Inline Parameters (Medium weight 500 matching Konfigurasi button) */
    .param-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: transparent;
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 0.38rem 0.85rem;
      font-size: 0.84rem;
      font-weight: 500;
      color: #2c333a;
      transition: background 0.15s ease;
    }

    .param-pill:hover:not(.disabled) {
      background: rgba(0, 25, 51, 0.06);
    }

    .param-pill label {
      font-weight: 500;
      color: #2c333a;
      margin: 0;
      white-space: nowrap;
      cursor: pointer;
    }

    .param-pill input {
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.84rem;
      font-weight: 500;
      color: #2c333a;
      outline: none;
      padding: 0;
    }

    .param-pill input#asof {
      width: 84px;
    }

    .param-pill input#topk {
      width: 32px;
      text-align: center;
      font-weight: 500;
    }

    .param-pill.disabled {
      opacity: 0.42;
    }

    /* Semi-Transparent Corpus Status Banner with only 'X' top-right */
    .corpus-banner {
      position: relative;
      width: 100%;
      max-width: 660px;
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: none;
      border-radius: 16px;
      padding: 1rem 2.4rem 1rem 1.35rem;
      box-shadow: 0 10px 28px rgba(0, 10, 22, 0.25);
      text-align: center;
      color: rgba(255, 255, 255, 0.92);
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .corpus-banner p {
      margin: 0;
      font-weight: 400;
    }

    .banner-close {
      position: absolute;
      top: 0.55rem;
      right: 0.65rem;
      width: 24px;
      height: 24px;
      border: none;
      outline: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.15rem;
      line-height: 1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .banner-close:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
    }

    /* Output Card (No outline, original structure preserved) */
    .output-wrapper {
      width: 100%;
      max-width: 920px;
      margin-top: 1.5rem;
    }

    .card {
      background: #ffffff;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 1.4rem;
      margin-bottom: 1rem;
      box-shadow: 0 12px 32px rgba(0, 10, 22, 0.35);
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .supported {
      background: #dafbe1;
      color: #116329;
    }

    .unknown {
      background: #ffebe9;
      color: #82071e;
    }

    pre {
      background: #f6f8fa;
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div id="heroWrapper" class="hero-wrapper">
    <h1 class="hero-title">UGM Academic Policy Intelligence</h1>

    <div class="search-shell">
      <div class="search-input-row">
        <button
          type="button"
          id="submitBtn"
          class="search-icon-btn"
          onclick="runQuery()"
          title="Cari"
          aria-label="Cari"
        >
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        <textarea
          id="query"
          rows="2"
          maxlength="1000"
          placeholder="Masukkan pertanyaan"
        ></textarea>
      </div>

      <div class="search-toolbar">
        <!-- Hidden select preserved for compatibility -->
        <select id="config" style="display:none;">
          <option value="B6" selected>B6</option>
          <option value="B5">B5</option>
          <option value="B4">B4</option>
          <option value="B3">B3</option>
          <option value="B2">B2</option>
          <option value="B1">B1</option>
          <option value="B0">B0</option>
        </select>

        <!-- Custom Konfigurasi Dropdown -->
        <div id="configDropdown" class="config-dropdown">
          <button type="button" id="configTrigger" class="config-trigger" title="Konfigurasi B0-B6">
            <span id="configLabel">Konfigurasi: B6</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div id="configMenu" class="config-menu">
            <button type="button" class="config-option active" data-value="B6">
              <span class="config-option-title">B6 — Guarded Agentic LLM</span>
              <span class="config-option-desc">Temporal filter + Hierarchical RAG + Verifikasi klaim</span>
            </button>
            <button type="button" class="config-option" data-value="B5">
              <span class="config-option-title">B5 — Adaptive RAG + QLoRA</span>
              <span class="config-option-desc">Adaptive retrieval dengan adapter QLoRA</span>
            </button>
            <button type="button" class="config-option" data-value="B4">
              <span class="config-option-title">B4 — Self-Corrective Adaptive RAG</span>
              <span class="config-option-desc">Adaptive retrieval dengan koreksi mandiri</span>
            </button>
            <button type="button" class="config-option" data-value="B3">
              <span class="config-option-title">B3 — Hybrid RAG + Reranker</span>
              <span class="config-option-desc">BM25 + Dense retrieval dengan reranking</span>
            </button>
            <button type="button" class="config-option" data-value="B2">
              <span class="config-option-title">B2 — Naive RAG (Dense + Fixed)</span>
              <span class="config-option-desc">Dense retrieval standar pada fixed chunks</span>
            </button>
            <button type="button" class="config-option" data-value="B1">
              <span class="config-option-title">B1 — Structured Prompted LLM</span>
              <span class="config-option-desc">Prompt terstruktur tanpa retrieval dokumen</span>
            </button>
            <button type="button" class="config-option" data-value="B0">
              <span class="config-option-title">B0 — Direct LLM Baseline</span>
              <span class="config-option-desc">Baseline langsung tanpa retrieval dokumen</span>
            </button>
          </div>
        </div>

        <!-- As-Of Date Parameter -->
        <div id="asofPill" class="param-pill" title="Tanggal acuan keberlakuan peraturan (YYYY-MM-DD)">
          <label for="asof">As of date:</label>
          <input id="asof" type="text" value="" placeholder="YYYY-MM-DD" />
        </div>

        <!-- Top-K Passage Parameter -->
        <div id="topkPill" class="param-pill" title="Jumlah potongan dokumen (passage) yang diambil">
          <label for="topk">Top-K Passage:</label>
          <input id="topk" type="number" min="1" max="10" value="5" />
        </div>
      </div>
    </div>

    <!-- Semi-Transparent Banner with only 'X' close button -->
    <div id="corpusBanner" class="corpus-banner">
      <button
        type="button"
        class="banner-close"
        aria-label="Tutup"
        onclick="document.getElementById('corpusBanner').style.display='none'"
      >&times;</button>
      <p id="health">Memuat status korpus...</p>
    </div>
  </div>

  <!-- Output Card (Unchanged structure, no outline) -->
  <div class="output-wrapper">
    <div id="resultCard" class="card" style="display:none;">
      <div>
        <span id="verdictBadge" class="badge"></span>
        <span id="metaLine" style="margin-left:0.6rem;font-size:0.88rem;color:#57606a;"></span>
      </div>
      <h3>Jawaban Terstruktur</h3>
      <div id="answerText" style="white-space:pre-line;line-height:1.55;"></div>
      <p id="abstainLine" style="color:#82071e;font-weight:600;"></p>
      <h4>Sitasi Passage &amp; Pasal</h4>
      <ul id="citationsList"></ul>
      <details style="margin-top:0.75rem;">
        <summary style="cursor:pointer;font-weight:600;">Verifikasi Klaim Atomik (<span id="claimsCount">0</span>)</summary>
        <ul id="claimsList"></ul>
      </details>
      <details style="margin-top:0.5rem;">
        <summary style="cursor:pointer;font-weight:600;">Execution Trace &amp; Observability</summary>
        <pre id="traceBox"></pre>
      </details>
    </div>
  </div>

  <script>
    const todayIso = new Date().toISOString().slice(0, 10);
    const asofInput = document.getElementById('asof');
    const topkInput = document.getElementById('topk');
    const asofPill = document.getElementById('asofPill');
    const topkPill = document.getElementById('topkPill');
    const queryInput = document.getElementById('query');
    const configSelect = document.getElementById('config');
    const configDropdown = document.getElementById('configDropdown');
    const configTrigger = document.getElementById('configTrigger');
    const configLabel = document.getElementById('configLabel');
    const configOptions = document.querySelectorAll('.config-option');

    asofInput.value = todayIso;

    // Auto-resize textarea
    queryInput.addEventListener('input', () => {
      queryInput.style.height = 'auto';
      queryInput.style.height = Math.min(queryInput.scrollHeight, 180) + 'px';
    });

    // Submit on Enter (Shift+Enter for new line)
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        runQuery();
      }
    });

    // Toggle "Konfigurasi v" dropdown
    configTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      configDropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!configDropdown.contains(e.target)) {
        configDropdown.classList.remove('open');
      }
    });

    // Sync As-Of Date and Top-K Passage state based on selected configuration (B0-B6)
    function syncParamsWithConfig(cfg) {
      const isNoRetrieval = (cfg === 'B0' || cfg === 'B1');
      topkInput.disabled = isNoRetrieval;
      topkPill.classList.toggle('disabled', isNoRetrieval);
      topkPill.title = isNoRetrieval
        ? `Top-K tidak digunakan pada ${cfg} (tanpa retrieval)`
        : 'Jumlah potongan dokumen (passage) yang diambil';

      const usesTemporalFilter = (cfg === 'B6');
      asofPill.title = usesTemporalFilter
        ? 'Filter keberlakuan temporal aktif pada B6 (YYYY-MM-DD)'
        : `Tanggal referensi as_of_date untuk ${cfg} (YYYY-MM-DD)`;
    }

    configOptions.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.dataset.value;
        configSelect.value = val;
        configLabel.textContent = `Konfigurasi: ${val}`;
        configOptions.forEach(o => o.classList.remove('active'));
        btn.classList.add('active');
        configDropdown.classList.remove('open');
        syncParamsWithConfig(val);
      });
    });

    syncParamsWithConfig('B6');

    fetch('/health').then(r => r.json()).then(d => {
      const rb = (d.retrieval_backend && d.retrieval_backend.actual_backend) || d.dense_backend || '-';
      const fb = d.fallback_used ? ' | FALLBACK AKTIF' : '';
      document.getElementById('health').textContent =
        `Korpus aktif: ${d.corpus_documents} dokumen | Chunks: ${d.hierarchical_searchable_chunks} | Backend: ${d.backend || '-'} (${d.base_model}) | Retrieval: ${rb}${fb}`;
    });

    async function runQuery() {
      const qVal = queryInput.value.trim();
      if (!qVal) return;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      try {
        const asofVal = asofInput.value.trim();
        const payload = {
          query: queryInput.value,
          config_id: configSelect.value,
          as_of_date: asofVal || null,
          top_k: Number(topkInput.value || 5)
        };
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        document.getElementById('heroWrapper').classList.add('has-results');
        document.getElementById('resultCard').style.display = 'block';
        const vb = document.getElementById('verdictBadge');
        vb.textContent = data.verdict.toUpperCase();
        vb.className = 'badge ' + (data.verdict === 'supported' ? 'supported' : 'unknown');
        document.getElementById('metaLine').textContent =
          `Config: ${data.config_id} | Backend: ${data.backend_type || '-'} | valid_time: ${data.valid_time || '-'} | Latency: ${data.latency_ms} ms | fallback: ${Boolean(data.fallback_used)}`;
        document.getElementById('answerText').textContent = data.answer;
        document.getElementById('abstainLine').textContent = data.abstain_reason ? `Alasan abstain: ${data.abstain_reason}` : '';

        const cl = document.getElementById('claimsList');
        cl.innerHTML = '';
        const claims = data.atomic_claims || [];
        document.getElementById('claimsCount').textContent = String(claims.length);
        claims.forEach(c => {
          const li = document.createElement('li');
          const reasonPart = c.reason ? ` (${c.reason})` : '';
          li.textContent = `[${c.verdict}${reasonPart}] ${c.statement}`;
          cl.appendChild(li);
        });

        const ct = document.getElementById('citationsList');
        ct.innerHTML = '';
        (data.citations || []).forEach(c => {
          const li = document.createElement('li');
          li.textContent = `${c.doc_id} (${c.pasal || c.section_path}, valid_time=${c.valid_time || '-'}, status=${c.status}): "${c.quote}"`;
          ct.appendChild(li);
        });

        document.getElementById('traceBox').textContent = JSON.stringify(data.trace || [], null, 2);
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
