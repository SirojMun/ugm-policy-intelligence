<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UGM Academic Policy Intelligence (B0–B6)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 2rem auto; padding: 0 1rem; background: #f7f8fa; color: #1b1f23; }
    .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    h1 { font-size: 1.4rem; margin-top: 0; color: #0b3c5d; }
    label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.3rem; }
    textarea, select, input { width: 100%; padding: 0.55rem; border: 1px solid #c5cdd6; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.8rem; margin-top: 0.75rem; }
    button { margin-top: 0.9rem; background: #0b3c5d; color: #fff; border: none; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    button:hover { background: #092e47; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .supported { background: #dafbe1; color: #116329; }
    .unknown { background: #ffebe9; color: #82071e; }
    pre { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>UGM Academic Policy Intelligence — Evaluasi B0–B6</h1>
    <p id="health">Memuat status korpus...</p>
    <label for="query">Pertanyaan Kebijakan / Akademik UGM</label>
    <textarea id="query" rows="3" placeholder="Contoh: Apakah Peraturan Rektor Nomor 1 Tahun 2026 tentang Fasilitas Dosen masih berlaku atau sudah dicabut?"></textarea>
    <div class="row">
      <div>
        <label for="config">Konfigurasi (B0–B6)</label>
        <select id="config">
          <option value="B6" selected>B6 — Guarded Agentic LLM</option>
          <option value="B5">B5 — Adaptive RAG + QLoRA</option>
          <option value="B4">B4 — Self-Corrective Adaptive RAG</option>
          <option value="B3">B3 — Hybrid RAG + Reranker</option>
          <option value="B2">B2 — Naive RAG (Dense + Fixed)</option>
          <option value="B1">B1 — Structured Prompted LLM</option>
          <option value="B0">B0 — Direct LLM Baseline</option>
        </select>
      </div>
      <div>
        <label for="asof">As-Of Date</label>
        <input id="asof" type="text" value="2026-11-25" />
      </div>
      <div>
        <label for="topk">Top-K Passage</label>
        <input id="topk" type="number" min="1" max="10" value="5" />
      </div>
    </div>
    <button onclick="runQuery()">Jalankan Query</button>
  </div>

  <div id="resultCard" class="card" style="display:none;">
    <div>
      <span id="verdictBadge" class="badge"></span>
      <span id="metaLine" style="margin-left:0.6rem;font-size:0.88rem;color:#57606a;"></span>
    </div>
    <h3>Jawaban Terstruktur</h3>
    <p id="answerText"></p>
    <p id="abstainLine" style="color:#82071e;font-weight:600;"></p>
    <h4>Klaim Atomik</h4>
    <ul id="claimsList"></ul>
    <h4>Sitasi Passage &amp; Pasal</h4>
    <ul id="citationsList"></ul>
    <h4>Execution Trace &amp; Observability</h4>
    <pre id="traceBox"></pre>
  </div>

  <script>
    fetch('/health').then(r => r.json()).then(d => {
      document.getElementById('health').textContent =
        `Korpus aktif: ${d.corpus_documents} dokumen | Chunks: ${d.hierarchical_searchable_chunks} | Model: ${d.base_model}`;
    });

    async function runQuery() {
      const payload = {
        query: document.getElementById('query').value,
        config_id: document.getElementById('config').value,
        as_of_date: document.getElementById('asof').value,
        top_k: Number(document.getElementById('topk').value || 5)
      };
      const res = await fetch('/api/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      document.getElementById('resultCard').style.display = 'block';
      const vb = document.getElementById('verdictBadge');
      vb.textContent = data.verdict.toUpperCase();
      vb.className = 'badge ' + (data.verdict === 'supported' ? 'supported' : 'unknown');
      document.getElementById('metaLine').textContent =
        `Config: ${data.config_id} | valid_time: ${data.valid_time || '-'} | Latency: ${data.latency_ms} ms | Prompt: ${data.prompt_version}`;
      document.getElementById('answerText').textContent = data.answer;
      document.getElementById('abstainLine').textContent = data.abstain_reason ? `Alasan abstain: ${data.abstain_reason}` : '';

      const cl = document.getElementById('claimsList');
      cl.innerHTML = '';
      (data.atomic_claims || []).forEach(c => {
        const li = document.createElement('li');
        li.textContent = `[${c.verdict}] ${c.statement}`;
        cl.appendChild(li);
      });

      const ct = document.getElementById('citationsList');
      ct.innerHTML = '';
      (data.citations || []).forEach(c => {
        const li = document.createElement('li');
        li.textContent = `${c.doc_id} (${c.pasal || c.section_path}, valid_time=${c.valid_time || '-'}, status=${c.status}): "${c.quote}"`;
        ct.appendChild(li);
      });

      document.getElementById('traceBox').textContent = JSON.stringify(data.trace || [], null, 2);
    }
  </script>
</body>
</html>
